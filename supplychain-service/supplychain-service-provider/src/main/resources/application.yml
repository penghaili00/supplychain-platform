server:
  port: 8090

spring:
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
        server-addr: ${SUPPLYCHAIN_NACOS_ADDR:127.0.0.1:8848}
        username: ${SUPPLYCHAIN_NACOS_USERNAME:nacos}
        password: ${SUPPLYCHAIN_NACOS_PASSWORD:nacos}
        namespace: ${SUPPLYCHAIN_NACOS_NAMESPACE:supplychain_local}
        group: ${SUPPLYCHAIN_NACOS_GROUP:DEFAULT_GROUP}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${SUPPLYCHAIN_MYSQL_HOST:127.0.0.1}:${SUPPLYCHAIN_MYSQL_PORT:3306}/supplychain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SUPPLYCHAIN_MYSQL_USERNAME:root}
    password: ${SUPPLYCHAIN_MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: select 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: ${SUPPLYCHAIN_REDIS_HOST:127.0.0.1}
      port: ${SUPPLYCHAIN_REDIS_PORT:6379}
      password: ${SUPPLYCHAIN_REDIS_PASSWORD:}
      database: ${SUPPLYCHAIN_REDIS_DATABASE:0}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://${SUPPLYCHAIN_NACOS_ADDR:127.0.0.1:8848}
    username: ${SUPPLYCHAIN_NACOS_USERNAME:nacos}
    password: ${SUPPLYCHAIN_NACOS_PASSWORD:nacos}
    file: ${user.dir}/.dubbo/${spring.application.name}-registry.cache
    use-as-config-center: false
    use-as-metadata-center: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

supplychain:
  elasticsearch:
    base-url: ${SUPPLYCHAIN_ES_URL:http://127.0.0.1:9200}
    username: ${SUPPLYCHAIN_ES_USERNAME:elastic}
    password: ${SUPPLYCHAIN_ES_PASSWORD:}
  security:
    jwt:
      issuer: supplychain
      secret: ${SUPPLYCHAIN_JWT_SECRET:SupplyChain-Default-Jwt-Secret-Please-Change-Now-2026}
      access-expire: 30m
      refresh-expire: 7d
      single-login: true
    app-auth:
      sign-secret: ${SUPPLYCHAIN_APP_SIGN_SECRET:SupplyChain-App-Sign-Secret-Please-Change-Now-2026}
      allowed-timestamp-skew: 5m
      nonce-ttl: 5m
      password:
        iterations: 120000
        hash-bytes: 32
      account-failure-rules:
        - window: 30m
          threshold: 5
          lock-duration: 10m
        - window: 2h
          threshold: 15
          lock-duration: 1h
        - window: 1d
          threshold: 20
          lock-duration: 1d
      ip-failure-rules:
        - window: 1d
          threshold: 30
          lock-duration: 1d
