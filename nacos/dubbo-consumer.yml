dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  registry:
    address: nacos://${SUPPLYCHAIN_NACOS_ADDR:127.0.0.1:8848}
    username: ${SUPPLYCHAIN_NACOS_USERNAME:nacos}
    password: ${SUPPLYCHAIN_NACOS_PASSWORD:nacos}
    file: ${user.dir}/.dubbo/${spring.application.name}-registry.cache
  metadata-report:
    address: nacos://${SUPPLYCHAIN_NACOS_ADDR:127.0.0.1:8848}
    username: ${SUPPLYCHAIN_NACOS_USERNAME:nacos}
    password: ${SUPPLYCHAIN_NACOS_PASSWORD:nacos}
    file: ${user.dir}/.dubbo/${spring.application.name}-metadata.cache
  consumer:
    check: false
    timeout: 5000
    retries: 0
